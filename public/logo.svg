<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="strata-grad-primary" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#5e6ad2" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="strata-surface" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15171a" />
      <stop offset="100%" stop-color="#08090a" />
    </linearGradient>
    <radialGradient id="strata-glow" cx="64" cy="40" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5e6ad2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#5e6ad2" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base with subtle border -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#strata-surface)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
  <circle cx="64" cy="44" r="44" fill="url(#strata-glow)" />

  <!-- Layered Architectural Strata Plates -->
  <!-- Top apex prism -->
  <path d="M64 26 L86 52 H42 Z" fill="#38bdf8" fill-opacity="0.9" />

  <!-- Middle strata tier -->
  <path d="M36 58 H92 L84 76 H44 Z" fill="#5e6ad2" fill-opacity="0.9" />

  <!-- Lower foundation strata tier -->
  <path d="M28 82 H100 L92 100 H36 Z" fill="#10b981" fill-opacity="0.85" />

  <!-- Hairline precision accents -->
  <line x1="24" y1="106" x2="104" y2="106" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="64" cy="106" r="2" fill="#f7f8f8" />
</svg>
